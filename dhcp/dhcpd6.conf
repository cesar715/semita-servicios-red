#
# DHCPv6 Server Configuration file.
#   see /usr/share/doc/dhcp-server/dhcpd6.conf.example
#   see dhcpd.conf(5) man page
#

authoritative;
default-lease-time 2592000;
preferred-lifetime 604800;

subnet6 FD00:DB7:DEA:A::/64 {
    range6 FD00:DB7:DEA:A::100 FD00:DB7:DEA:A::200;
    option dhcp6.name-servers FD00:DB7:DEA:A::2;
    option dhcp6.domain-search "semita.sv";
}
